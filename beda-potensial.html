<style>

<body>
<div id="overlay">
  <h1>AR Praktikum Elektronika</h1>

<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-image-three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ───── KONFIGURASI ─────
const IMAGE_TARGET_SRC = 'targets/bumi.mind';
const AR_SCALE = 0.6;
const VMAX = 12;
const RAIL_L = -0.62, RAIL_R = 0.62, Y_BOT = -0.58;
const PSU_X = -0.30, PSU_W = 0.54, PSU_H = 0.30, MAIN_SW_X = 0.32;
const SW_GAP = 0.11, LAMP_GAP = 0.10, WIRE_R = 0.016;
const BRANCH_DEF = [
  { id: 's1', y: 0.58, R: 10, lampX: -0.28, swX: 0.26 },
  { id: 's2', y: 0.18, R: 20, lampX: -0.28, swX: 0.26 },
  { id: 's3', y: -0.22, R: 40, lampX: -0.28, swX: 0.26 },
];

const $ = (id) => document.getElementById(id);
const startBtn = $('startBtn'), demoBtn = $('demoBtn'), stopBtn = $('stopBtn');
const overlay = $('overlay'), hud = $('hud'), hudText = $('hudText'), modeBadge = $('modeBadge');
const panel = $('panel'), container = $('container'), statusMsg = $('statusMsg'), infoEl = $('info');
const slider = $('vSlider'), vOut = $('vOut');

const state = { main: false, s1: false, s2: false, s3: false, volt: 6 };
let mindarThree = null, mode3D = null, currentMode = null, circuit = null;
let arRenderer = null, arScene = null, arCamera = null, drag = null;
const clock = new THREE.Clock();

// ───── HELPER ─────
const wireMat = new THREE.MeshStandardMaterial({ color: 0xd9a441, metalness: 0.9, roughness: 0.3 });
const yAxis = new THREE.Vector3(0, 1, 0);
function makeWire(x1, y1, x2, y2, r = WIRE_R) {
  const a = new THREE.Vector3(x1, y1, 0), b = new THREE.Vector3(x2, y2, 0);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, a.distanceTo(b), 12), wireMat);
  m.position.copy(a).lerp(b, 0.5);
  m.quaternion.setFromUnitVectors(yAxis, b.clone().sub(a).normalize());
  return m;
}
const jointGeo = new THREE.SphereGeometry(WIRE_R * 1.35, 12, 12);
function addJoint(p, x, y) { const m = new THREE.Mesh(jointGeo, wireMat); m.position.set(x, y, 0); p.add(m); }

function makeLabel(text, color = '#8ef7ff', w = 0.30) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128;
  const x = c.getContext('2d');
  x.font = 'bold 64px -apple-system,"Segoe UI",Roboto,sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillStyle = color; x.shadowColor = 'rgba(0,0,0,.85)'; x.shadowBlur = 14;
  x.fillText(text, 256, 68);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthTest: false, depthWrite: false }));
  s.scale.set(w, w / 4, 1);
  return s;
}

const glowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'), g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,240,180,1)'); g.addColorStop(.25, 'rgba(255,196,90,.55)');
  g.addColorStop(.6, 'rgba(255,150,40,.14)'); g.addColorStop(1, 'rgba(255,140,30,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
})();

const postMat = new THREE.MeshStandardMaterial({ color: 0xffc107, metalness: 0.9, roughness: 0.25 });
const postGeo = new THREE.CylinderGeometry(0.023, 0.023, 0.05, 12);

// ───── LAMPU ─────
function createLamp(label) {
  const g = new THREE.Group();
  const p1 = new THREE.Mesh(postGeo, postMat), p2 = new THREE.Mesh(postGeo, postMat);
  p1.position.set(-LAMP_GAP, 0.02, 0); p2.position.set(LAMP_GAP, 0.02, 0);
  g.add(p1, p2, makeWire(-LAMP_GAP, 0, -0.04, 0), makeWire(0.04, 0, LAMP_GAP, 0));

  const metal = new THREE.MeshStandardMaterial({ color: 0xc4ccd2, metalness: 0.9, roughness: 0.3 });
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.08, 24), metal);
  base.position.y = 0.01; g.add(base);
  const bulbMat = new THREE.MeshStandardMaterial({
    color: 0xe6f4ff, emissive: 0xffb347, emissiveIntensity: 0, transparent: true,
    opacity: 0.28, roughness: 0.05, depthWrite: false,
  });
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.075, 28, 22), bulbMat);
  bulb.position.y = 0.15; g.add(bulb);
  const filMat = new THREE.MeshStandardMaterial({ color: 0x6a5a48, emissive: 0xff9a1a, emissiveIntensity: 0 });
  const fil = new THREE.Mesh(new THREE.TorusGeometry(0.02, 0.004, 6, 20), filMat);
  fil.position.y = 0.15; g.add(fil);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
  halo.position.y = 0.15; halo.scale.set(0.45, 0.45, 1); g.add(halo);
  const lbl = makeLabel(label, '#9ef7ff', 0.34); lbl.position.set(0, -0.14, 0); g.add(lbl);
  g.userData = { bulbMat, filMat, halo };
  return g;
}

// ───── SAKLAR ─────
function createSwitch(label, swId) {
  const g = new THREE.Group();
  const p1 = new THREE.Mesh(postGeo, postMat), p2 = new THREE.Mesh(postGeo, postMat);
  p1.position.set(-SW_GAP, 0.02, 0); p2.position.set(SW_GAP, 0.02, 0); g.add(p1, p2);
  const lever = new THREE.Group(), armMat = new THREE.MeshStandardMaterial({ color: 0xff5252, metalness: 0.5, roughness: 0.4 });
  const arm = new THREE.Mesh(new THREE.BoxGeometry(SW_GAP * 2, 0.03, 0.03), armMat); arm.position.x = SW_GAP;
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.03, 14, 14), armMat); knob.position.x = SW_GAP * 2;
  lever.add(arm, knob); lever.position.set(-SW_GAP, 0.038, 0); g.add(lever);
  const hit = new THREE.Mesh(new THREE.BoxGeometry(SW_GAP * 2 + 0.24, 0.24, 0.24), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
  hit.position.y = 0.04; g.add(hit);
  const lbl = makeLabel(label, '#ffd166'); lbl.position.set(0, 0.16, 0); g.add(lbl);
  g.userData.lever = lever;
  g.traverse((o) => { o.userData.swId = swId; });
  return g;
}

// ───── POWER SUPPLY VARIABEL ─────
function createPSU() {
  const g = new THREE.Group();
  const D = 0.2, zf = D / 2 + 0.002;
  g.add(new THREE.Mesh(new THREE.BoxGeometry(PSU_W, PSU_H, D), new THREE.MeshStandardMaterial({ color: 0x2c3a4a, metalness: 0.5, roughness: 0.45 })));

  // Terminal (− kiri hitam, + kanan merah)
  const tm = (c) => new THREE.MeshStandardMaterial({ color: c, metalness: 0.6, roughness: 0.4 });
  const tn = new THREE.Mesh(postGeo, tm(0x222222)), tp = new THREE.Mesh(postGeo, tm(0xe11d48));
  tn.rotation.z = tp.rotation.z = Math.PI / 2;
  tn.position.set(-PSU_W / 2 - 0.01, 0, 0); tp.position.set(PSU_W / 2 + 0.01, 0, 0); g.add(tn, tp);

  // Layar digital
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 128;
  const tex = new THREE.CanvasTexture(cv);
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 0.125), new THREE.MeshBasicMaterial({ map: tex }));
  screen.position.set(-0.12, 0.02, zf); g.add(screen);

  // LED indikator
  const ledMat = new THREE.MeshStandardMaterial({ color: 0x14532d, emissive: 0x22c55e, emissiveIntensity: 0 });
  const led = new THREE.Mesh(new THREE.SphereGeometry(0.015, 12, 12), ledMat);
  led.position.set(0.05, 0.095, zf); g.add(led);

  // Potensio (knob putar)
  const knob = new THREE.Group();
  const kb = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.065, 0.05, 28), new THREE.MeshStandardMaterial({ color: 0x111827, metalness: 0.6, roughness: 0.35 }));
  kb.rotation.x = Math.PI / 2; kb.position.z = 0.025;
  const tick = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.05, 0.01), new THREE.MeshBasicMaterial({ color: 0xfacc15 }));
  tick.position.set(0, 0.03, 0.053);
  knob.add(kb, tick); knob.position.set(0.17, -0.01, zf);
  g.add(knob);
  const hit = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 12), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
  hit.position.copy(knob.position); hit.position.z += 0.04; g.add(hit);
  hit.userData.swId = kb.userData.swId = tick.userData.swId = 'knob';

  const t1 = makeLabel('POWER SUPPLY DC', '#fde68a', 0.42); t1.position.set(0, 0.2, 0); g.add(t1);
  const t2 = makeLabel('0–12 V', '#fde68a', 0.2); t2.position.set(0.17, -0.12, zf); g.add(t2);
  const tMin = makeLabel('\u2212', '#8ecbff', 0.12); tMin.position.set(-PSU_W / 2 - 0.01, 0.1, 0); g.add(tMin);
  const tPls = makeLabel('+', '#ff8a80', 0.12); tPls.position.set(PSU_W / 2 + 0.01, 0.1, 0); g.add(tPls);

  g.userData = { cv, tex, knob, led, ledMat, hit, last: '' };
  return g;
}

function drawDisplay(psu, V, I, on) {
  const key = V.toFixed(1) + I.toFixed(2) + on;
  if (psu.userData.last === key) return;
  psu.userData.last = key;
  const c = psu.userData.cv, x = c.getContext('2d');
  x.fillStyle = '#04140c'; x.fillRect(0, 0, 256, 128);
  x.fillStyle = on ? '#4ade80' : '#1f5a3a';
  x.textAlign = 'right'; x.textBaseline = 'middle';
  x.font = 'bold 62px monospace'; x.fillText(V.toFixed(1) + ' V', 240, 40);
  x.font = 'bold 40px monospace'; x.fillText(I.toFixed(2) + ' A', 240, 98);
  psu.userData.tex.needsUpdate = true;
}

// ───── PATH ELEKTRON ─────
function makeLoopPath(y) {
  const pts = [[RAIL_R, Y_BOT], [RAIL_R, y], [RAIL_L, y], [RAIL_L, Y_BOT], [PSU_X - PSU_W / 2, Y_BOT], [PSU_X + PSU_W / 2, Y_BOT], [MAIN_SW_X, Y_BOT]]
    .map((p) => new THREE.Vector3(p[0], p[1], 0));
  const segs = []; let total = 0;
  pts.forEach((a, i) => { const b = pts[(i + 1) % pts.length], len = a.distanceTo(b); segs.push({ a, b, len, start: total }); total += len; });
  return { segs, total };
}
const _v = new THREE.Vector3();
function pointAt(path, s) {
  s = ((s % path.total) + path.total) % path.total;
  for (const g of path.segs) if (s <= g.start + g.len) return _v.copy(g.a).lerp(g.b, (s - g.start) / g.len);
  return _v.copy(path.segs[path.segs.length - 1].b);
}

// ───── BUILD RANGKAIAN ─────
function buildCircuit(parent) {
  const root = new THREE.Group(); parent.add(root);
  const board = new THREE.Mesh(new THREE.BoxGeometry(1.62, 1.78, 0.05), new THREE.MeshStandardMaterial({ color: 0x0f3b30, roughness: 0.75, metalness: 0.15 }));
  board.position.set(0, 0.0, -0.13); root.add(board);

  const topY = BRANCH_DEF[0].y;
  root.add(makeWire(RAIL_L, Y_BOT, RAIL_L, topY), makeWire(RAIL_R, Y_BOT, RAIL_R, topY));
  root.add(makeWire(RAIL_L, Y_BOT, PSU_X - PSU_W / 2, Y_BOT));
  root.add(makeWire(PSU_X + PSU_W / 2, Y_BOT, MAIN_SW_X - SW_GAP, Y_BOT));
  root.add(makeWire(MAIN_SW_X + SW_GAP, Y_BOT, RAIL_R, Y_BOT));
  addJoint(root, RAIL_L, Y_BOT); addJoint(root, RAIL_R, Y_BOT);
  BRANCH_DEF.forEach((d) => { addJoint(root, RAIL_L, d.y); addJoint(root, RAIL_R, d.y); });

  const psu = createPSU(); psu.position.set(PSU_X, Y_BOT, 0); root.add(psu);
  const mainSwitch = createSwitch('SAKLAR UTAMA', 'main'); mainSwitch.position.set(MAIN_SW_X, Y_BOT, 0); root.add(mainSwitch);

  const eGeo = new THREE.SphereGeometry(0.018, 8, 8), eMat = new THREE.MeshBasicMaterial({ color: 0x6ff2ff });
  const branches = BRANCH_DEF.map((d, i) => {
    const g = new THREE.Group();
    g.add(makeWire(RAIL_L, d.y, d.lampX - LAMP_GAP, d.y), makeWire(d.lampX + LAMP_GAP, d.y, d.swX - SW_GAP, d.y), makeWire(d.swX + SW_GAP, d.y, RAIL_R, d.y));
    const lamp = createLamp(`LAMPU ${i + 1} · ${d.R}Ω`); lamp.position.set(d.lampX, d.y, 0); g.add(lamp);
    const sw = createSwitch('S' + (i + 1), d.id); sw.position.set(d.swX, d.y, 0); g.add(sw);
    const eg = new THREE.Group(), electrons = [];
    for (let k = 0; k < 9; k++) { const e = new THREE.Mesh(eGeo, eMat); e.userData.phase = k / 9; eg.add(e); electrons.push(e); }
    eg.visible = false; g.add(eg); root.add(g);
    return { ...d, lamp, switchObj: sw, lever: sw.userData.lever, path: makeLoopPath(d.y), electrons, eg, glow: 0, pos: 0 };
  });

  return { root, branches, psu, mainSwitch, mainLever: mainSwitch.userData.lever,
    tappables: [mainSwitch, psu.userData.hit, ...branches.map((b) => b.switchObj)] };
}

// ───── ANIMASI ─────
function totalCurrent() {
  if (!state.main) return 0;
  return BRANCH_DEF.reduce((s, d) => s + (state[d.id] ? state.volt / d.R : 0), 0);
}

function updateCircuit(dt) {
  if (!circuit) return;
  const k = Math.min(1, dt * 14), V = state.volt;
  circuit.mainLever.rotation.z += ((state.main ? 0 : 0.95) - circuit.mainLever.rotation.z) * k;

  const u = circuit.psu.userData;
  u.knob.rotation.z = 2.4 - (V / VMAX) * 4.8;
  u.ledMat.emissiveIntensity = state.main ? 2.5 : 0;
  drawDisplay(circuit.psu, V, totalCurrent(), state.main);

  circuit.branches.forEach((b) => {
    const on = state.main && state[b.id];
    b.lever.rotation.z += ((state[b.id] ? 0 : 0.95) - b.lever.rotation.z) * k;
    const I = on ? V / b.R : 0, P = V * I;
    const target = on ? Math.min(1, Math.pow(P / 10, 0.7)) : 0;   // terang ∝ daya V²/R
    b.glow += (target - b.glow) * Math.min(1, dt * 8);
    const d = b.lamp.userData;
    d.bulbMat.emissiveIntensity = b.glow * 1.8;
    d.bulbMat.opacity = 0.28 + b.glow * 0.4;
    d.filMat.emissiveIntensity = b.glow * 3.5;
    d.halo.visible = b.glow > 0.01;
    d.halo.material.opacity = b.glow;
    d.halo.scale.setScalar(0.25 + 0.3 * b.glow);

    b.eg.visible = on && I > 0.01;
    if (b.eg.visible) {
      b.pos += dt * (0.15 + I * 0.9);       // kecepatan ∝ arus
      b.electrons.forEach((e) => e.position.copy(pointAt(b.path, b.pos + e.userData.phase * b.path.total)));
    }
  });
}

// ───── UI ─────
function setVolt(v) {
  state.volt = Math.max(0, Math.min(VMAX, v));
  slider.value = state.volt; vOut.textContent = state.volt.toFixed(1) + ' V';
  syncUI();
}
function syncUI() {
  const n = state.main ? BRANCH_DEF.filter((d) => state[d.id]).length : 0;
  const I = totalCurrent().toFixed(2);
  if (!state.main) infoEl.textContent = 'Saklar utama terbuka — ketuk SAKLAR UTAMA untuk menutup rangkaian.';
  else if (!n) infoEl.textContent = 'Semua saklar cabang terbuka — tidak ada arus.';
  else infoEl.textContent = `${n} cabang aktif · V = ${state.volt.toFixed(1)} V (sama tiap cabang) · I total = ${I} A`;
}
slider.addEventListener('input', () => setVolt(parseFloat(slider.value)));

const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
function cam() {
  if (currentMode === 'ar') return { r: arRenderer, c: arCamera };
  if (currentMode === '3d' && mode3D) return { r: mode3D.renderer, c: mode3D.camera };
  return null;
}
function onPointerDown(e) {
  if (!circuit || (e.target.closest && e.target.closest('#panel, #hud, #overlay'))) return;
  const rc = cam(); if (!rc) return;
  const rect = rc.r.domElement.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  if (x < 0 || y < 0 || x > rect.width || y > rect.height) return;
  pointer.set((x / rect.width) * 2 - 1, -(y / rect.height) * 2 + 1);
  raycaster.setFromCamera(pointer, rc.c);
  const hits = raycaster.intersectObjects(circuit.tappables, true);
  const id = hits.length && hits[0].object.userData.swId;
  if (id === 'knob') {
    drag = { x: e.clientX, v: state.volt };
    if (mode3D) mode3D.controls.enabled = false;
  } else if (id) { state[id] = !state[id]; syncUI(); }
}
function onPointerMove(e) { if (drag) setVolt(drag.v + ((e.clientX - drag.x) / 200) * VMAX); }
function onPointerUp() { drag = null; if (mode3D) mode3D.controls.enabled = true; }
function bindPointer(on) {
  const f = on ? 'addEventListener' : 'removeEventListener';
  window[f]('pointerdown', onPointerDown); window[f]('pointermove', onPointerMove); window[f]('pointerup', onPointerUp);
}

async function mindFileExists() {
  try {
    let r = await fetch(IMAGE_TARGET_SRC, { method: 'HEAD', cache: 'no-store' });
    if (r.status === 405 || r.status === 501) r = await fetch(IMAGE_TARGET_SRC, { cache: 'no-store' });
    return r.ok;
  } catch { return false; }
}
function addLights(scene) {
  scene.add(new THREE.HemisphereLight(0xbfe9ff, 0x203030, 1.5));
  const d = new THREE.DirectionalLight(0xffffff, 1.5); d.position.set(0.8, 1.6, 1.2); scene.add(d);
  const f = new THREE.DirectionalLight(0xaaccff, 0.7); f.position.set(-1, 0.6, 0.8); scene.add(f);
}
function showHUD(badge, text, is3d) {
  overlay.style.display = 'none'; hud.style.display = 'flex'; panel.style.display = 'flex';
  modeBadge.textContent = badge; modeBadge.classList.toggle('mode-3d', is3d);
  hudText.textContent = text; setVolt(state.volt);
}

// ───── START AR ─────
async function startAR() {
  startBtn.disabled = demoBtn.disabled = true;
  statusMsg.classList.remove('error'); statusMsg.textContent = 'Menyiapkan AR...';
  if (!(await mindFileExists())) {
    statusMsg.classList.add('error');
    statusMsg.textContent = 'File ' + IMAGE_TARGET_SRC + ' tidak ditemukan. Beralih ke Mode 3D…';
    setTimeout(() => start3DMode('Mode 3D — file target AR belum tersedia.'), 900);
    return;
  }
  try {
    statusMsg.textContent = 'Meminta izin kamera...';
    container.innerHTML = ''; container.className = 'mode-ar'; container.style.display = 'block';
    mindarThree = new MindARThree({ container, imageTargetSrc: IMAGE_TARGET_SRC });
    arRenderer = mindarThree.renderer; arScene = mindarThree.scene; arCamera = mindarThree.camera;
    addLights(arScene);
    const anchor = mindarThree.addAnchor(0);
    circuit = buildCircuit(anchor.group);
    circuit.root.scale.setScalar(AR_SCALE);
    anchor.onTargetFound = () => { hudText.textContent = 'Target terdeteksi ✓ — ketuk saklar, geser knob'; };
    anchor.onTargetLost = () => { hudText.textContent = 'Arahkan kamera ke gambar target…'; };
    await mindarThree.start();
    currentMode = 'ar';
    showHUD('AR', 'Arahkan kamera ke gambar target…', false);
    bindPointer(true);
    clock.start();
    arRenderer.setAnimationLoop(() => { updateCircuit(Math.min(clock.getDelta(), 0.05)); arRenderer.render(arScene, arCamera); });
    statusMsg.textContent = '';
  } catch (err) {
    console.error('[AR] Gagal:', err);
    try { if (mindarThree) { mindarThree.renderer.setAnimationLoop(null); await mindarThree.stop(); } } catch (_) {}
    mindarThree = arRenderer = arScene = arCamera = circuit = null;
    container.style.display = 'none'; container.innerHTML = '';
    start3DMode('AR tidak dapat dimulai (kamera/target bermasalah). Mode 3D aktif.');
  }
}

// ───── MODE 3D ─────
function start3DMode(note = '') {
  container.innerHTML = ''; container.className = 'mode-3d'; container.style.display = 'block';
  const w = window.innerWidth, h = window.innerHeight;
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); renderer.setSize(w, h);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  container.appendChild(renderer.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0b0f14);
  const grid = new THREE.GridHelper(4, 40, 0x1f3b34, 0x142822); grid.position.y = -0.95; scene.add(grid);
  const camera = new THREE.PerspectiveCamera(48, w / h, 0.1, 100); camera.position.set(0.05, 0.45, 2.3);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0, 0); controls.enableDamping = true; controls.minDistance = 0.8; controls.maxDistance = 5;
  addLights(scene);
  circuit = buildCircuit(scene);

  const mode = { renderer, camera, controls, animId: 0, onResize: null };
  const c3 = new THREE.Clock();
  (function loop() {
    mode.animId = requestAnimationFrame(loop);
    updateCircuit(Math.min(c3.getDelta(), 0.05)); controls.update(); renderer.render(scene, camera);
  })();
  mode.onResize = () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); };
  window.addEventListener('resize', mode.onResize);
  mode3D = mode; currentMode = '3d';
  showHUD('3D', 'Geser = putar · Cubit = zoom · Ketuk saklar · Geser knob = atur V', true);
  bindPointer(true);
  statusMsg.classList.remove('error'); statusMsg.textContent = note;
  startBtn.disabled = demoBtn.disabled = false;
}

// ───── STOP ─────
async function stopAR() {
  bindPointer(false); drag = null;
  if (currentMode === 'ar' && mindarThree) {
    try { mindarThree.renderer.setAnimationLoop(null); await mindarThree.stop(); } catch (_) {}
    mindarThree = arRenderer = arScene = arCamera = null;
  } else if (currentMode === '3d' && mode3D) {
    cancelAnimationFrame(mode3D.animId);
    window.removeEventListener('resize', mode3D.onResize);
    try { mode3D.controls.dispose(); mode3D.renderer.dispose(); } catch (_) {}
    mode3D = null;
  }
  container.innerHTML = ''; container.style.display = 'none';
  hud.style.display = panel.style.display = 'none'; overlay.style.display = 'flex';
  statusMsg.textContent = ''; statusMsg.classList.remove('error');
  state.main = state.s1 = state.s2 = state.s3 = false;
  circuit = null; currentMode = null; startBtn.disabled = demoBtn.disabled = false;
}

startBtn.addEventListener('click', startAR);
demoBtn.addEventListener('click', () => start3DMode('Mode 3D — tanpa kamera.'));
stopBtn.addEventListener('click', stopAR);
</script>
</body>
